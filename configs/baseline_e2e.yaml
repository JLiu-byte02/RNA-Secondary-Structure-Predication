run_name: baseline_e2e_mega
output_dir: runs
seed: 17
device: auto
data:
  train:
    glob: data/datasets/official_bprna_train.jsonl.gz
  select:
    glob: data/datasets/official_bprna_valid.jsonl.gz
  eval:
    TS0:
      glob: data/datasets/official_bprna_test.jsonl.gz
    bpRNA-new:
      glob: data/datasets/official_bprna_bprna_new.jsonl.gz
  thermo_dir: null
  channels: []
  min_sep: 4
  max_length: 1024
  strict_sequence: false
  strict_pairs: false
  require_eligible: false
  use_rinalmo_alphabet: true
  num_workers: 0
model:
  backbone:
    type: rinalmo
    lm_config: mega
    pretrained_path: weights/rinalmo_mega_pretrained.pt
    mode: full
    last_k: 4
    gradient_checkpointing: true
    flash_attn: auto
  head:
    type: outer_product
    kwargs:
      conv_dim: 64
      num_blocks: 2
  channels: []
train:
  epochs: 10
  batch_size: 1
  eval_batch_size: 1
  bucket_size: 32
  grad_accum: 8
  optimizer: adamw
  loss: eligible_candidates
  lr: 0.0001
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  scheduler: linear
  warmup_steps: 500
  min_lr_ratio: 0.1
  clip_grad_norm: 1.0
  bf16: true
  patience: 3
  log_every: 50
  num_workers: 0
  pos_weight: null
  smoke_epochs: 2
  smoke_max_records: 8
  smoke_max_length: 512
  eval_max_tokens_per_batch: 512
selection:
  metric: rna_macro_official_flexible_f1
  thresholds: 0.01:0.29:0.01
decode:
  min_sep: 4
  write_predictions: true
