run_name: official_recipe_giga
output_dir: runs
seed: 17
device: auto
data:
  train:
    glob: data/datasets/official_bprna_train.jsonl.gz
  select:
    glob: data/datasets/official_bprna_valid.jsonl.gz
  eval:
    TS0:
      glob: data/datasets/official_bprna_test.jsonl.gz
    bpRNA-new:
      glob: data/datasets/official_bprna_bprna_new.jsonl.gz
  thermo_dir: null
  channels: []
  min_sep: 4
  max_length: 1024
  strict_sequence: false
  strict_pairs: false
  require_eligible: false
  use_rinalmo_alphabet: true
  num_workers: 0
model:
  backbone:
    type: rinalmo
    lm_config: giga
    pretrained_path: weights/rinalmo_giga_pretrained.pt
    mode: frozen
    last_k: 3
    gradient_checkpointing: true
    flash_attn: auto
  head:
    type: outer_product
    kwargs:
      conv_dim: 64
      num_blocks: 2
  channels: []
train:
  epochs: 15
  batch_size: 1
  eval_batch_size: 1
  bucket_size: 16
  grad_accum: 1
  optimizer: adam
  loss: full_upper_triangle
  lr: 0.0001
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.999
  scheduler: linear
  scheduler_total_steps: 7000
  warmup_steps: 0
  min_lr_ratio: 0.1
  clip_grad_norm: 1.0
  bf16: true
  patience: 0
  log_every: 25
  num_workers: 0
  pos_weight: null
  unfreeze_initial_denom_lr: 10.0
  unfreeze_schedule:
    1:
      mode: frozen
    4:
      mode: last_k
      last_k: 3
    7:
      mode: last_k
      last_k: 6
    10:
      mode: last_k
      last_k: 9
    13:
      mode: last_k
      last_k: 12
  smoke_epochs: 2
  smoke_max_records: 8
  smoke_max_length: 512
  eval_max_tokens_per_batch: 512
selection:
  metric: rna_macro_official_flexible_f1
  thresholds: 0.01:0.29:0.01
decode:
  min_sep: 4
  write_predictions: true
